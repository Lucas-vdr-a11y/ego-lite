name: Main PR Source

on:
  pull_request:
    branches:
      - main

jobs:
  require-sprint-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require sprint branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            sprint-?*) ;;
            *)
              echo "Pull requests into main must come from a sprint-* branch."
              exit 1
              ;;
          esac
